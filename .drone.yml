---
kind: pipeline
type: kubernetes
name: staging

trigger:
  branch:
    - staging

steps:
  - name: publish-backend
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/contentlab-search
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      dockerfile: Dockerfile.backend
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    when:
      event:
        - push

  - name: deploy-backend-staging
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.30.0
      add_repos: [mongodb=https://10gen.github.io/helm-charts]
      namespace: industrysolutions
      release: contentlab-search
      values:
        - "image.tag=git-${DRONE_COMMIT_SHA:0:7}"
        - "image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/contentlab-search"
        - "ingress.enabled=true"
        - "ingress.hosts[0]=contentlab-search.industrysolutions.staging.corp.mongodb.com"
        - "mesh.enabled=true"
        - "resources.limits.cpu=500m" #reduce resources
        - "resources.limits.memory=512Mi"
        - "resources.requests.cpu=250m"
        - "resources.requests.memory=256Mi"
      api_server: https://api.staging.corp.mongodb.com
      kubernetes_token:
        from_secret: staging_kubernetes_token
      values_files: ["environments/staging.yaml"]
    when:
      event:
        - push
---
kind: pipeline
type: kubernetes
name: prod

trigger:
  branch:
    - main

steps:
  - name: publish-backend
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/contentlab-search
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      dockerfile: Dockerfile.backend
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    when:
      event:
        - push

  - name: deploy-backend-prod
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.30.0
      add_repos: [mongodb=https://10gen.github.io/helm-charts]
      namespace: industrysolutions
      release: contentlab-search
      values:
        - "image.tag=git-${DRONE_COMMIT_SHA:0:7}"
        - "image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/contentlab-search"
        - "ingress.enabled=true"
        - "ingress.hosts[0]=contentlab-search.industrysolutions.prod.corp.mongodb.com"
        - "mesh.enabled=true"
        - "resources.limits.cpu=500m"
        - "resources.limits.memory=1024Mi"
        - "resources.requests.cpu=250m"
        - "resources.requests.memory=512Mi"
      api_server: https://api.prod.corp.mongodb.com
      kubernetes_token:
        from_secret: prod_kubernetes_token
      values_files: ["environments/prod.yaml"]
    when:
      event:
        - push

  # One-off: pushes the current Grove key into the cluster Secret. That Secret is
  # created out-of-band, so a redeploy alone never updates it — the values file only
  # references it by name. Remove this step once the Secret is correct.
  - name: patch-grove-key
    image: alpine/kubectl:1.31.0
    environment:
      KUBE_TOKEN:
        from_secret: prod_kubernetes_token
      GROVE_KEY:
        from_secret: grove_api_key
    commands:
      # The API server presents an internal CA the container doesn't carry, so the
      # cert chain can't be verified here. The connection is still authenticated by
      # the bearer token, over the cluster's own network.
      - kubectl config set-cluster prod --server=https://api.prod.corp.mongodb.com --insecure-skip-tls-verify=true
      - kubectl config set-credentials drone --token=$$KUBE_TOKEN
      - kubectl config set-context prod --cluster=prod --user=drone --namespace=industrysolutions
      - kubectl --context=prod -n industrysolutions patch secret contentlab-search --type merge -p "{\"stringData\":{\"GROVE_API_KEY\":\"$$GROVE_KEY\"}}"
      # Helm leaves the pods alone when the image tag is unchanged, so without this
      # the new value would sit unread in the Secret.
      - kubectl --context=prod -n industrysolutions rollout restart deploy/contentlab-search-web-app
      - kubectl --context=prod -n industrysolutions rollout status deploy/contentlab-search-web-app --timeout=180s
    when:
      event:
        - push
