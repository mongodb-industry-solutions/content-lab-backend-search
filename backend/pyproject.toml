[tool.poetry]
name = "your-virtual-env"
version = "0.1.0"
description = "Test-Scrapers"
authors = ["Aswin <aswin.subramanianmaheswaran@mongodb.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
pymongo = "^4.10.1"
python-dotenv = "^1.0.1"
fastapi = ">=0.115.4"
uvicorn = ">=0.32.0"
httpx = "^0.27.0"
beautifulsoup4 = "^4.12.3"
requests = "^2.31.0"
feedparser = "^6.0.10"
tweepy = "^4.14.0"
praw = "^7.8.1"
scheduler = "^0.8.8"
langchain-community = "^0.3.27"
langchain-tavily = "^0.2.7"
pytz = "^2025.2"
# Security: Explicit version constraints for vulnerable transitive dependencies
urllib3 = ">=2.7.0"
starlette = ">=0.49.1"
aiohttp = ">=3.14.3"
langchain-core = ">=0.3.6"
setuptools = ">=83.0.0"
h2 = ">=4.4.1"



[tool.poetry.group.dev.dependencies]
pip-licenses = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
